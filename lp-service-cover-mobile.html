<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LP Service Cover Mobile</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:1220px;height:1240px;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f8fafc;color:#111827;overflow:hidden}
    .canvas{width:1220px;height:1240px;padding:62px;background:linear-gradient(135deg,#fff 0%,#eff6ff 100%);position:relative}
    .eyebrow{display:inline-block;background:#dbeafe;color:#1d4ed8;border-radius:999px;padding:12px 18px;font-size:25px;font-weight:900;margin-bottom:28px}
    h1{font-size:66px;line-height:1.07;margin:0 0 22px;letter-spacing:0;max-width:520px}.sub{font-size:30px;line-height:1.42;color:#344054;max-width:510px}
    .phones{position:absolute;right:42px;top:148px;display:flex;gap:18px;align-items:flex-end}
    .phone{width:286px;background:#111827;border:12px solid #111827;border-radius:48px;box-shadow:0 26px 66px rgba(17,24,39,.23);overflow:hidden}.phone.small{width:286px;opacity:.96}
    .phone img{width:100%;height:660px;object-fit:contain;object-position:top center;background:#fff;border-radius:34px;display:block}
    .points{position:absolute;left:62px;bottom:108px;width:520px;display:grid;gap:18px}.point{background:white;border:2px solid #d0d5dd;border-radius:18px;padding:22px;font-size:29px;font-weight:900}
    .foot{position:absolute;left:62px;bottom:48px;font-size:24px;color:#667085;font-weight:800}
  </style>
</head>
<body>
  <div class="canvas">
    <span class="eyebrow">スマホで見やすい1ページ</span>
    <h1>SNSリンクから見せやすい</h1>
    <p class="sub">スマホ閲覧を前提に、メニュー・料金・問い合わせ導線を迷わず読める順番に整理します。</p>
    <div class="phones">
      <div class="phone small"><img src="assets/cover-home-mobile.png" alt=""></div>
      <div class="phone"><img src="assets/case-salon-mobile.png" alt=""></div>
    </div>
    <div class="points">
      <div class="point">大きく押しやすいボタン</div>
      <div class="point">読みやすい料金表示</div>
      <div class="point">問い合わせまで迷わせない</div>
    </div>
    <div class="foot">Northstar Web Studio / Web制作スタジオ</div>
  </div>
</body>
</html>
