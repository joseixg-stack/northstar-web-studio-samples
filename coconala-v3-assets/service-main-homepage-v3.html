<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coconala Service Main Homepage V3</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:1220px;height:1240px;overflow:hidden;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#111827;background:#fff}
    .canvas{position:relative;width:1220px;height:1240px;padding:62px;background:linear-gradient(135deg,#fff 0%,#f6f9fc 62%,#edf7f3 100%)}
    .badge{display:inline-flex;align-items:center;gap:10px;background:#fff7ed;border:2px solid #fed7aa;color:#9a3412;border-radius:999px;padding:13px 20px;font-size:25px;font-weight:900;margin-bottom:30px}
    .badge:before{content:"";width:12px;height:12px;border-radius:50%;background:#d97706}
    h1{font-size:76px;line-height:1.04;margin:0 0 22px;letter-spacing:0;max-width:760px}
    .lead{font-size:32px;line-height:1.4;color:#344054;max-width:720px;margin:0 0 32px}
    .price{display:inline-flex;align-items:flex-end;gap:18px;background:#111827;color:white;border-radius:22px;padding:24px 32px;margin-bottom:32px;box-shadow:0 18px 40px rgba(17,24,39,.16)}
    .price span{font-size:30px;font-weight:800;color:#d0d5dd}.price b{font-size:78px;line-height:.92;color:#fbbf24}
    .points{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:650px}
    .point{background:white;border:2px solid #d0d5dd;border-radius:16px;padding:19px 20px;font-size:27px;font-weight:900;box-shadow:0 10px 24px rgba(17,24,39,.06)}
    .mock{position:absolute;right:44px;bottom:78px;width:354px;border:10px solid #111827;border-radius:42px;background:white;box-shadow:0 30px 70px rgba(17,24,39,.24);overflow:hidden}
    .mock img{width:100%;height:612px;object-fit:cover;object-position:top;display:block}
    .ribbon{position:absolute;right:50px;top:66px;background:#0f766e;color:#fff;border-radius:18px;padding:18px 22px;font-size:25px;font-weight:950;box-shadow:0 16px 36px rgba(15,118,110,.22)}
    .note{position:absolute;left:62px;bottom:126px;background:#eef6f5;color:#0f766e;border:2px solid #b7ddd5;border-radius:16px;padding:18px 22px;font-size:26px;font-weight:950}
    .foot{position:absolute;left:62px;bottom:50px;font-size:24px;color:#667085;font-weight:800}
  </style>
</head>
<body>
  <div class="canvas">
    <div class="badge">小規模店舗・サロン・教室向け</div>
    <h1>小さなお店の<br>1ページ<br>ホームページ制作</h1>
    <p class="lead">料金・流れ・よくある質問・問い合わせ導線を、スマホで見やすく整理します。</p>
    <div class="price"><span>初回受付価格</span><b>15,000円</b></div>
    <div class="points">
      <div class="point">電話なしOK</div>
      <div class="point">スマホ対応</div>
      <div class="point">修正2回込み</div>
      <div class="point">最大5セクション</div>
    </div>
    <div class="note">購入前相談OK</div>
    <div class="ribbon">初めてのWebページに</div>
    <div class="mock"><img src="../assets/case-salon-mobile.png" alt=""></div>
    <div class="foot">Northstar Web Studio / Web制作・LP制作</div>
  </div>
</body>
</html>
