<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LP Service Cover Flow</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:1220px;height:1240px;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#101828;color:white;overflow:hidden}
    .canvas{width:1220px;height:1240px;padding:70px;background:linear-gradient(145deg,#101828 0%,#182230 68%,#0f766e 100%)}
    .badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:12px 18px;font-size:24px;font-weight:900;margin-bottom:26px}
    h1{font-size:76px;line-height:1.05;margin:0 0 22px;letter-spacing:0}.sub{font-size:31px;color:#d0d5dd;max-width:920px;margin:0 0 40px;line-height:1.42}
    .steps{display:grid;gap:22px}.step{display:grid;grid-template-columns:120px 1fr;align-items:center;background:white;color:#111827;border-radius:24px;padding:23px}
    .num{width:86px;height:86px;background:#0f766e;color:white;border-radius:50%;display:grid;place-items:center;font-size:42px;font-weight:900}.step b{font-size:37px}.step p{font-size:24px;color:#475467;margin:8px 0 0;line-height:1.35}
    .foot{margin-top:34px;background:#fbbf24;color:#261600;border-radius:20px;padding:25px;font-size:33px;font-weight:900;text-align:center}
  </style>
</head>
<body>
  <div class="canvas">
    <span class="badge">制作の流れ</span>
    <h1>メッセージだけで進行できます</h1>
    <p class="sub">電話会議なし。必要情報をトークルームで確認し、1ページLPを制作します。</p>
    <div class="steps">
      <div class="step"><div class="num">1</div><div><b>ヒアリング</b><p>業種、目的、掲載したい内容を確認します。</p></div></div>
      <div class="step"><div class="num">2</div><div><b>原稿・素材確認</b><p>写真、料金、メニュー、参考イメージを確認します。</p></div></div>
      <div class="step"><div class="num">3</div><div><b>初稿制作</b><p>素材がそろってから3日目安で制作します。</p></div></div>
      <div class="step"><div class="num">4</div><div><b>修正1回・納品</b><p>軽微な修正を反映し、HTML・CSS等の完成データで納品します。</p></div></div>
    </div>
    <div class="foot">必要情報を整理して、スムーズに制作を進めます</div>
  </div>
</body>
</html>
