<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coconala Cover Cases</title>
  <style>
    *{box-sizing:border-box}body{margin:0;width:1220px;height:1240px;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#111827;color:white;overflow:hidden}
    .canvas{padding:64px}.eyebrow{display:inline-block;background:#fef3c7;color:#92400e;border-radius:999px;padding:12px 18px;font-size:24px;font-weight:900;margin-bottom:28px}
    h1{font-size:78px;line-height:1.04;margin:0 0 22px}.sub{font-size:32px;color:#d0d5dd;margin:0 0 36px;max-width:900px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.shot{background:white;border-radius:22px;padding:14px;color:#111827}.shot img{width:100%;height:310px;object-fit:cover;object-position:top;border-radius:14px;border:1px solid #d0d5dd}.shot b{display:block;font-size:30px;margin:14px 6px 4px}.shot span{display:block;color:#667085;font-size:22px;margin:0 6px 8px}.notice{margin-top:28px;background:#0f766e;border-radius:18px;padding:24px;font-size:32px;font-weight:900;text-align:center}
  </style>
</head>
<body>
  <div class="canvas">
    <div class="eyebrow">制作イメージ</div>
    <h1>美容室・教室・相談サービスに対応</h1>
    <p class="sub">サービス内容、料金、予約・問い合わせ導線を1ページに整理します。</p>
    <div class="grid">
      <div class="shot"><img src="assets/case-salon-desktop.png" alt=""><b>美容室 / サロン</b><span>メニュー・料金・予約導線</span></div>
      <div class="shot"><img src="assets/case-course-desktop.png" alt=""><b>教室 / レッスン</b><span>内容・料金・申込み導線</span></div>
      <div class="shot"><img src="assets/case-consulting-desktop.png" alt=""><b>相談サービス</b><span>流れ・料金・FAQ</span></div>
      <div class="shot"><img src="assets/case-nail-desktop.png" alt=""><b>ネイル / 個人サービス</b><span>日本語・中国語対応</span></div>
    </div>
    <div class="notice">低予算でもまず1ページで公開したい方向け</div>
  </div>
</body>
</html>
