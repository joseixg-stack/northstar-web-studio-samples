<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LP Service Cover Cases</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:1220px;height:1240px;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#111827;color:white;overflow:hidden}
    .canvas{width:1220px;height:1240px;padding:54px 60px;background:linear-gradient(145deg,#111827 0%,#182230 62%,#0f766e 100%)}
    .eyebrow{display:inline-block;background:#fef3c7;color:#92400e;border-radius:999px;padding:11px 17px;font-size:23px;font-weight:900;margin-bottom:22px}
    h1{font-size:64px;line-height:1.05;margin:0 0 16px;letter-spacing:0}.sub{font-size:28px;color:#d0d5dd;margin:0 0 26px;max-width:960px;line-height:1.34}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.shot{background:white;border-radius:20px;padding:12px;color:#111827;box-shadow:0 18px 44px rgba(0,0,0,.22)}
    .shot img{width:100%;height:224px;object-fit:cover;object-position:top;border-radius:13px;border:1px solid #d0d5dd}.shot b{display:block;font-size:27px;margin:12px 6px 3px}.shot span{display:block;color:#667085;font-size:20px;margin:0 6px 6px}
    .notice{margin-top:20px;background:#fbbf24;color:#261600;border-radius:18px;padding:20px;font-size:29px;font-weight:900;text-align:center}
  </style>
</head>
<body>
  <div class="canvas">
    <div class="eyebrow">制作イメージ</div>
    <h1>店舗・教室・個人サービスに対応</h1>
    <p class="sub">内容、料金、問い合わせまでの流れを1ページに整理。初めてのWebページでも見やすい構成で制作します。</p>
    <div class="grid">
      <div class="shot"><img src="assets/case-salon-desktop.png" alt=""><b>美容室 / サロン</b><span>メニュー・料金・問い合わせ導線</span></div>
      <div class="shot"><img src="assets/case-seitai-desktop.png" alt=""><b>整体 / リラクゼーション</b><span>施術内容・料金・外部予約リンク</span></div>
      <div class="shot"><img src="assets/case-guesthouse-desktop.png" alt=""><b>民宿 / 体験サービス</b><span>施設紹介・料金・アクセス</span></div>
      <div class="shot"><img src="assets/case-nail-desktop.png" alt=""><b>ネイル / 個人サービス</b><span>多言語対応は相談</span></div>
    </div>
    <div class="notice">お店の内容を、初めてのお客様にも分かりやすく整理します</div>
  </div>
</body>
</html>
