<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LP Service Cover Included</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:1220px;height:1240px;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#fff;color:#111827;overflow:hidden}
    .canvas{padding:70px;width:1220px;height:1240px;background:linear-gradient(135deg,#fff 0%,#fff7ed 42%,#f8fafc 100%)}
    .badge{display:inline-block;background:#fff7ed;color:#b45309;border:2px solid #fed7aa;border-radius:999px;padding:12px 18px;font-size:24px;font-weight:900;margin-bottom:26px}
    h1{font-size:76px;line-height:1.05;margin:0 0 22px;letter-spacing:0}.sub{font-size:31px;color:#344054;max-width:940px;margin:0 0 42px;line-height:1.42}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.item{background:white;border:2px solid #d0d5dd;border-radius:22px;padding:28px;min-height:142px;box-shadow:0 12px 28px rgba(17,24,39,.06)}
    .item span{display:block;color:#b45309;font-size:24px;font-weight:900;margin-bottom:8px}.item b{font-size:36px;line-height:1.16}.note{margin-top:38px;background:#111827;color:white;border-radius:22px;padding:30px;font-size:34px;font-weight:900;text-align:center}
  </style>
</head>
<body>
  <div class="canvas">
    <span class="badge">制作に含まれる内容</span>
    <h1>1ページで必要情報を整理</h1>
    <p class="sub">サービス内容・料金・流れ・問い合わせ導線を、初めて見る方にも分かりやすい順番で整理します。</p>
    <div class="grid">
      <div class="item"><span>Section 01</span><b>トップメッセージ</b></div>
      <div class="item"><span>Section 02</span><b>サービス紹介</b></div>
      <div class="item"><span>Section 03</span><b>メニュー / 料金</b></div>
      <div class="item"><span>Section 04</span><b>流れ / FAQ</b></div>
      <div class="item"><span>Section 05</span><b>問い合わせ導線</b></div>
      <div class="item"><span>Plus</span><b>スマホ対応</b></div>
    </div>
    <div class="note">最大5セクション / 修正1回 / 完成データ納品</div>
  </div>
</body>
</html>
