<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coconala Cover Scope</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:1220px;height:1240px;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#fff;color:#111827;overflow:hidden}
    .canvas{padding:70px;background:#f8fafc;width:1220px;height:1240px}.badge{display:inline-block;background:#fee2e2;color:#991b1b;border-radius:999px;padding:12px 18px;font-size:24px;font-weight:900;margin-bottom:26px}
    h1{font-size:70px;line-height:1.08;margin:0 0 22px;letter-spacing:0}.sub{font-size:31px;color:#344054;max-width:960px;margin:0 0 42px;line-height:1.42}
    .columns{display:grid;grid-template-columns:1fr 1fr;gap:26px}.col{border-radius:24px;padding:34px;background:white;border:2px solid #d0d5dd;min-height:560px}.col.ok{border-color:#86efac}.col.no{border-color:#fecaca}
    .col h2{font-size:44px;margin:0 0 24px}.col ul{margin:0;padding-left:28px}.col li{font-size:30px;margin:18px 0;line-height:1.22}.ok h2{color:#047857}.no h2{color:#b91c1c}
    .note{margin-top:34px;background:#111827;color:white;border-radius:22px;padding:28px;font-size:31px;line-height:1.36;font-weight:900}
  </style>
</head>
<body>
  <div class="canvas">
    <span class="badge">初回価格プランの範囲</span>
    <h1>できること / 別料金になること</h1>
    <p class="sub">後からトラブルにならないよう、最初に制作範囲を明確にします。</p>
    <div class="columns">
      <div class="col ok">
        <h2>含まれる内容</h2>
        <ul>
          <li>1ページ制作</li>
          <li>最大5セクション</li>
          <li>スマホ対応</li>
          <li>文章整理</li>
          <li>修正1回</li>
        </ul>
      </div>
      <div class="col no">
        <h2>別料金</h2>
        <ul>
          <li>追加ページ</li>
          <li>予約システム</li>
          <li>決済機能</li>
          <li>会員機能</li>
          <li>無制限修正</li>
        </ul>
      </div>
    </div>
    <div class="note">集客・売上・SEO順位の保証はできません。内容を分かりやすく整理する制作サービスです。</div>
  </div>
</body>
</html>
