<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coconala Cover Main</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:1220px;height:1240px;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#111827;overflow:hidden}
    .canvas{width:1220px;height:1240px;padding:68px;background:linear-gradient(135deg,#ffffff 0%,#f3f7fb 58%,#e7f1ff 100%);position:relative}
    .badge{display:inline-flex;gap:10px;align-items:center;background:#ecfdf3;color:#047857;border:2px solid #bbf7d0;border-radius:999px;padding:13px 21px;font-size:25px;font-weight:900;margin-bottom:34px}
    h1{font-size:86px;line-height:1.03;margin:0 0 28px;letter-spacing:0;max-width:770px}
    .sub{font-size:34px;line-height:1.38;color:#344054;max-width:760px;margin:0 0 34px}
    .price{display:inline-flex;align-items:flex-end;gap:18px;background:#111827;color:white;border-radius:24px;padding:25px 34px;margin-bottom:40px}
    .price span{font-size:30px;font-weight:800;color:#d0d5dd}.price b{font-size:80px;line-height:.92;color:#fbbf24}
    .points{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:640px}
    .point{background:white;border:2px solid #d0d5dd;border-radius:18px;padding:21px;font-size:29px;font-weight:900;box-shadow:0 10px 26px rgba(17,24,39,.06)}
    .mock{position:absolute;right:48px;bottom:82px;width:350px;border:10px solid #111827;border-radius:42px;background:white;box-shadow:0 30px 70px rgba(17,24,39,.24);overflow:hidden}
    .mock img{width:100%;height:600px;object-fit:cover;object-position:top;display:block}
    .foot{position:absolute;left:68px;bottom:50px;font-size:24px;color:#667085;font-weight:800}
  </style>
</head>
<body>
  <div class="canvas">
    <div class="badge">日本語・中国語対応 / メッセージだけで進行</div>
    <h1>1ページLPを制作します</h1>
    <p class="sub">小規模店舗・教室・個人サービス向け。サービス内容、料金、流れ、問い合わせ導線をスマホで読みやすく整理します。</p>
    <div class="price"><span>初回受付価格</span><b>9,800円</b></div>
    <div class="points">
      <div class="point">スマホ対応</div>
      <div class="point">3日目安</div>
      <div class="point">修正1回込み</div>
      <div class="point">最大5セクション</div>
    </div>
    <div class="mock"><img src="assets/case-salon-mobile.png" alt=""></div>
    <div class="foot">Northstar Web Studio / Web制作スタジオ</div>
  </div>
</body>
</html>
