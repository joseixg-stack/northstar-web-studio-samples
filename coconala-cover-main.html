<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coconala Cover</title>
  <style>
    *{box-sizing:border-box}body{margin:0;width:1220px;height:1240px;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f7f8fb;color:#111827;overflow:hidden}
    .canvas{width:1220px;height:1240px;padding:70px;background:radial-gradient(circle at 80% 10%,#dbeafe 0,#f7f8fb 32%,#fff 70%);position:relative}
    .badge{display:inline-block;background:#ecfdf3;color:#047857;border:2px solid #bbf7d0;border-radius:999px;padding:13px 20px;font-size:26px;font-weight:900;margin-bottom:34px}
    h1{font-size:92px;line-height:1.03;margin:0 0 30px;letter-spacing:0;max-width:870px}
    .sub{font-size:36px;line-height:1.35;color:#344054;max-width:830px;margin-bottom:34px}
    .price{display:inline-flex;align-items:end;gap:18px;background:#111827;color:white;border-radius:24px;padding:26px 34px;margin-bottom:42px}
    .price span{font-size:30px}.price b{font-size:82px;line-height:.9;color:#fbbf24}
    .points{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:760px}
    .point{background:white;border:2px solid #d0d5dd;border-radius:18px;padding:22px;font-size:30px;font-weight:900}
    .mock{position:absolute;right:58px;bottom:76px;width:410px;border:10px solid #111827;border-radius:42px;background:white;box-shadow:0 30px 70px rgba(17,24,39,.24);overflow:hidden}
    .mock img{width:100%;display:block}
    .foot{position:absolute;left:70px;bottom:54px;font-size:24px;color:#667085;font-weight:800}
  </style>
</head>
<body>
  <div class="canvas">
    <div class="badge">日本語 / 中国語対応 · メッセージだけで進行</div>
    <h1>1ページLP制作</h1>
    <p class="sub">小規模店舗・教室・個人サービス向け。メニュー、料金、流れ、問い合わせ導線をスマホで見やすく整理します。</p>
    <div class="price"><span>初回限定</span><b>9,800円</b></div>
    <div class="points">
      <div class="point">スマホ対応</div>
      <div class="point">3日目安</div>
      <div class="point">修正1回</div>
      <div class="point">最大5セクション</div>
    </div>
    <div class="mock"><img src="assets/case-salon-mobile.png" alt=""></div>
    <div class="foot">Northstar Web Studio · Web制作スタジオ</div>
  </div>
</body>
</html>
